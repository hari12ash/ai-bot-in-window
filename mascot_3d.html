<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  #canvas-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
<script>
// Define safe global bridge hooks immediately so Python calls never throw TypeError
window._pendingState = 'STAND';
window._pendingLook = { dx: 0, dy: 0 };

window.setMascotState = function(state) {
    window._pendingState = state;
    if (window._applyMascotState) {
        window._applyMascotState(state);
    }
};

window.setTargetLook = function(dx, dy) {
    window._pendingLook = { dx, dy };
    if (window._applyTargetLook) {
        window._applyTargetLook(dx, dy);
    }
};
</script>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="slime_model_data.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<script>
// =====================================================================
// SLIME 3D JELLY AVATAR ENGINE (from slime folder)
// =====================================================================
const container = document.getElementById('canvas-container');
const width = window.innerWidth || 145;
const height = window.innerHeight || 240;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
// Position camera to frame the slime avatar comfortably
camera.position.set(0, 0.25, 3.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting setup: studio jelly illumination with blue rim glow
const ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff7ed, 1.15);
dirLight.position.set(2.5, 4.0, 3.0);
dirLight.castShadow = true;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.95);
rimLight.position.set(-2.5, 2.5, -2.0);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xbae6fd, 0.60);
fillLight.position.set(0, -1.0, 2.5);
scene.add(fillLight);

// Soft radial ground shadow
const shadowGeo = new THREE.PlaneGeometry(1.6, 0.6);
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 64;
shadowCanvas.height = 64;
const sCtx = shadowCanvas.getContext('2d');
const sGrad = sCtx.createRadialGradient(32, 32, 4, 32, 32, 30);
sGrad.addColorStop(0, 'rgba(15, 23, 42, 0.38)');
sGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
sCtx.fillStyle = sGrad;
sCtx.fillRect(0, 0, 64, 64);
const shadowTex = new THREE.CanvasTexture(shadowCanvas);
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.set(0, -0.62, 0);
scene.add(shadowMesh);

const characterRoot = new THREE.Group();
scene.add(characterRoot);

let slimeMesh = null;
let baseScale = 0.85;

function base64ToArrayBuffer(base64) {
    const binary_string = window.atob(base64);
    const len = binary_string.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
    }
    return bytes.buffer;
}

// Load and center the Slime 3D model
if (window.SLIME_GLB_BASE64 && THREE.GLTFLoader) {
    const loader = new THREE.GLTFLoader();
    const arrayBuffer = base64ToArrayBuffer(window.SLIME_GLB_BASE64);
    loader.parse(arrayBuffer, '', function(gltf) {
        slimeMesh = gltf.scene;

        // Hide the large Blender green ground plane (Plane.002) to preserve transparent desktop
        slimeMesh.traverse(function(child) {
            if (child.name === 'Plane.002') {
                child.visible = false;
            }
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.material) {
                    child.material.roughness = 0.22;
                    child.material.metalness = 0.05;
                }
            }
        });

        // Compute exact bounding box of the slime body
        const box = new THREE.Box3();
        slimeMesh.traverse(function(child) {
            if (child.isMesh && child.name !== 'Plane.002') {
                box.expandByObject(child);
            }
        });

        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        // Center slime at local origin
        slimeMesh.position.x = -center.x;
        slimeMesh.position.y = -center.y + 0.08;
        slimeMesh.position.z = -center.z;

        // Fit nicely into the viewport
        const maxDim = Math.max(size.x, size.y, size.z) || 2.0;
        baseScale = 1.55 / maxDim;
        characterRoot.scale.set(baseScale, baseScale, baseScale);

        characterRoot.add(slimeMesh);
    }, function(err) {
        console.error('Error loading Slime GLB:', err);
    });
}

// Cute floating bubbles & sparkles particle system
const bubbleCount = 18;
const bubbleGeo = new THREE.BufferGeometry();
const bubblePositions = new Float32Array(bubbleCount * 3);
const bubbleVelocities = [];

for (let i = 0; i < bubbleCount; i++) {
    bubblePositions[i * 3] = (Math.random() - 0.5) * 1.8;
    bubblePositions[i * 3 + 1] = (Math.random() - 0.5) * 1.8;
    bubblePositions[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
    bubbleVelocities.push({
        vx: (Math.random() - 0.5) * 0.005,
        vy: Math.random() * 0.007 + 0.004,
        vz: (Math.random() - 0.5) * 0.005,
        wobble: Math.random() * Math.PI * 2
    });
}
bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePositions, 3));

const bCanvas = document.createElement('canvas');
bCanvas.width = 32;
bCanvas.height = 32;
const bCtx = bCanvas.getContext('2d');
bCtx.beginPath();
bCtx.arc(16, 16, 12, 0, Math.PI * 2);
bCtx.fillStyle = 'rgba(147, 197, 253, 0.65)';
bCtx.fill();
bCtx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
bCtx.lineWidth = 2;
bCtx.stroke();
// highlight reflection dot on bubble
bCtx.beginPath();
bCtx.arc(12, 12, 3, 0, Math.PI * 2);
bCtx.fillStyle = '#ffffff';
bCtx.fill();

const bubbleTexture = new THREE.CanvasTexture(bCanvas);
const bubbleMat = new THREE.PointsMaterial({
    size: 0.16,
    map: bubbleTexture,
    transparent: true,
    opacity: 0.85,
    depthWrite: false
});
const bubbleParticles = new THREE.Points(bubbleGeo, bubbleMat);
scene.add(bubbleParticles);

// --- STATE & INTERACTIVE CONTROL ---
let currentState = window._pendingState || "STAND";
let lookTarget = { x: 0, y: 0 };
let currentLook = { x: 0, y: 0 };
let clock = new THREE.Clock();
let hopCycle = 0;

window._applyMascotState = function(state) {
    currentState = state;
};

window._applyTargetLook = function(dx, dy) {
    lookTarget.x = Math.max(-1, Math.min(1, dx));
    lookTarget.y = Math.max(-1, Math.min(1, dy));
};

if (window._pendingLook) {
    window._applyTargetLook(window._pendingLook.dx, window._pendingLook.dy);
}

window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

// --- ANIMATION LOOP ---
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    const time = clock.getElapsedTime();

    // Smooth cursor look-at tracking
    currentLook.x += (lookTarget.x - currentLook.x) * 0.10;
    currentLook.y += (lookTarget.y - currentLook.y) * 0.10;

    if (characterRoot) {
        // Slime faces cursor with smooth tilt
        characterRoot.rotation.y = currentLook.x * 0.45;
        characterRoot.rotation.x = -currentLook.y * 0.25;
        characterRoot.rotation.z = -currentLook.x * 0.08;

        if (currentState === "WALK") {
            hopCycle += dt * 7.5;
            const hopSin = Math.sin(hopCycle);
            const hopHeight = Math.max(0, hopSin) * 0.32;
            characterRoot.position.y = -0.15 + hopHeight;

            // Squash & stretch dynamics
            if (hopSin < 0) {
                // Ground contact squash
                const squash = 1.0 - Math.abs(hopSin) * 0.22;
                characterRoot.scale.set(baseScale * (2.0 - squash), baseScale * squash, baseScale * (2.0 - squash));
                shadowMesh.scale.set(1.22, 1.22, 1.22);
            } else {
                // Airborne stretch
                const stretch = 1.0 + hopSin * 0.18;
                characterRoot.scale.set(baseScale / Math.sqrt(stretch), baseScale * stretch, baseScale / Math.sqrt(stretch));
                shadowMesh.scale.set(0.85, 0.85, 0.85);
            }

        } else if (currentState === "CURIOUS") {
            // Excited wobble and forward lean
            const curiousWobble = Math.sin(time * 12) * 0.05;
            characterRoot.position.y = -0.15 + Math.sin(time * 5) * 0.04;
            characterRoot.rotation.x = 0.28 + curiousWobble;
            characterRoot.rotation.z = Math.sin(time * 8) * 0.08;
            characterRoot.scale.set(baseScale * 1.05, baseScale * 0.96, baseScale * 1.05);
            shadowMesh.scale.set(1.0, 1.0, 1.0);

        } else if (currentState === "REACTION" || currentState === "BOW") {
            // Happy high spring bounce!
            const bounce = Math.abs(Math.sin(time * 9)) * 0.42;
            characterRoot.position.y = -0.15 + bounce;
            const spring = 1.0 + (bounce > 0.05 ? 0.22 : -0.18);
            characterRoot.scale.set(baseScale / Math.sqrt(spring), baseScale * spring, baseScale / Math.sqrt(spring));
            shadowMesh.scale.set(Math.max(0.6, 1.2 - bounce * 0.8), Math.max(0.6, 1.2 - bounce * 0.8), 1);

        } else {
            // STAND / IDLE - gentle jelly breathing and subtle float
            const breathe = time * 2.6;
            const breathScaleY = 1.0 + Math.sin(breathe) * 0.045;
            const breathScaleXZ = 1.0 - Math.sin(breathe) * 0.025;
            characterRoot.position.y = -0.15 + Math.sin(breathe) * 0.025;
            characterRoot.scale.set(baseScale * breathScaleXZ, baseScale * breathScaleY, baseScale * breathScaleXZ);
            shadowMesh.scale.set(1.0 + Math.sin(breathe) * 0.05, 1.0 + Math.sin(breathe) * 0.05, 1.0);
        }
    }

    // Floating bubble animation
    const bPos = bubbleGeo.attributes.position.array;
    for (let i = 0; i < bubbleCount; i++) {
        const vel = bubbleVelocities[i];
        vel.wobble += dt * 2.0;
        bPos[i * 3] += vel.vx + Math.sin(vel.wobble) * 0.002;
        bPos[i * 3 + 1] += vel.vy;
        bPos[i * 3 + 2] += vel.vz;

        if (bPos[i * 3 + 1] > 1.2) {
            bPos[i * 3 + 1] = -0.8;
            bPos[i * 3] = (Math.random() - 0.5) * 1.6;
        }
    }
    bubbleGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
