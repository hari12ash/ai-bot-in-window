<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #canvas-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
<script src="three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<script>
// --- AUTHENTIC 2.5D / 3D CEL-SHADED CHITANDA ENGINE ---
const container = document.getElementById('canvas-container');
const width = window.innerWidth;
const height = window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
camera.position.set(0, 0, 4.8);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.1);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffe4e6, 0.8);
dirLight.position.set(2, 4, 3);
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0xd8b4fe, 0.6);
rimLight.position.set(-3, 2, -1);
scene.add(rimLight);

// Root Group
const chitandaRoot = new THREE.Group();
scene.add(chitandaRoot);

// Load Authentic Chitanda Sprite Texture
const textureLoader = new THREE.TextureLoader();
const spriteTexture = textureLoader.load('chitanda_uniform.png', (tex) => {
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
});

// Texture Aspect Ratio: 157x404 -> H: 3.2, W: 3.2 * (157/404) ≈ 1.24
const planeGeo = new THREE.PlaneGeometry(1.24, 3.2);

// Double-sided material with alpha transparency and subtle cel lighting
const chitandaMat = new THREE.MeshLambertMaterial({
  map: spriteTexture,
  transparent: true,
  alphaTest: 0.05,
  side: THREE.DoubleSide
});

const chitandaMesh = new THREE.Mesh(planeGeo, chitandaMat);
chitandaMesh.position.y = -0.15;
chitandaRoot.add(chitandaMesh);

// Subtle 3D Depth Shadow Plane
const shadowGeo = new THREE.PlaneGeometry(1.0, 0.28);
const shadowMat = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.25
});
const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.set(0, -1.72, 0);
chitandaRoot.add(shadowMesh);

// 3D Sakura Blossom Particle System
const petalCount = 28;
const petalGeo = new THREE.BufferGeometry();
const petalPositions = new Float32Array(petalCount * 3);
const petalVelocities = [];

for (let i = 0; i < petalCount; i++) {
  petalPositions[i * 3] = (Math.random() - 0.5) * 2.8;
  petalPositions[i * 3 + 1] = (Math.random() - 0.5) * 3.6;
  petalPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
  petalVelocities.push({
    vx: (Math.random() - 0.5) * 0.012,
    vy: -(Math.random() * 0.012 + 0.008),
    vz: (Math.random() - 0.5) * 0.008,
    rot: Math.random() * Math.PI
  });
}
petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPositions, 3));

// Create cute pink petal canvas texture
const pCanvas = document.createElement('canvas');
pCanvas.width = 32;
pCanvas.height = 32;
const pCtx = pCanvas.getContext('2d');
pCtx.fillStyle = '#f472b6';
pCtx.beginPath();
pCtx.ellipse(16, 16, 12, 7, Math.PI / 4, 0, Math.PI * 2);
pCtx.fill();
const petalTexture = new THREE.CanvasTexture(pCanvas);

const petalMat = new THREE.PointsMaterial({
  size: 0.16,
  map: petalTexture,
  transparent: true,
  opacity: 0.75,
  depthWrite: false
});
const petalParticles = new THREE.Points(petalGeo, petalMat);
scene.add(petalParticles);

// State & Animation
let currentState = "WALK";
let lookTarget = { x: 0, y: 0 };
let currentLook = { x: 0, y: 0 };
let clock = new THREE.Clock();

window.setMascotState = function(state) {
  currentState = state;
};

window.setTargetLook = function(dx, dy) {
  lookTarget.x = Math.max(-1, Math.min(1, dx));
  lookTarget.y = Math.max(-1, Math.min(1, dy));
};

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Smooth mouse look-at tracking
  currentLook.x += (lookTarget.x - currentLook.x) * 0.08;
  currentLook.y += (lookTarget.y - currentLook.y) * 0.08;

  // Head and body 3D tilt
  chitandaMesh.rotation.y = currentLook.x * 0.45;
  chitandaMesh.rotation.x = -currentLook.y * 0.25;

  if (currentState === "WALK") {
    // Walking stride bounce and momentum sway
    const bounce = -Math.abs(Math.sin(time * 6.0)) * 0.08;
    chitandaMesh.position.y = -0.15 + bounce;
    chitandaMesh.rotation.z = Math.sin(time * 3.0) * 0.06;
    shadowMesh.scale.setScalar(1.0 + bounce * 1.5);
  } else if (currentState === "CURIOUS") {
    // Leaning forward eagerly
    chitandaMesh.position.y = -0.10 + Math.sin(time * 3.0) * 0.03;
    chitandaMesh.rotation.x = -0.18 + Math.sin(time * 2.0) * 0.03;
    chitandaMesh.rotation.z = Math.sin(time * 1.5) * 0.02;
  } else if (currentState === "SLEEP") {
    chitandaMesh.position.y = -0.18 + Math.sin(time * 1.2) * 0.02;
    chitandaMesh.rotation.z = 0.08;
  } else {
    // Stand breathing
    chitandaMesh.position.y = -0.15 + Math.sin(time * 2.2) * 0.03;
    chitandaMesh.rotation.z = Math.sin(time * 1.1) * 0.015;
  }

  // Update Sakura Petals
  const posArr = petalGeo.attributes.position.array;
  for (let i = 0; i < petalCount; i++) {
    const v = petalVelocities[i];
    posArr[i * 3] += v.vx + Math.sin(time + i) * 0.003;
    posArr[i * 3 + 1] += v.vy;
    posArr[i * 3 + 2] += v.vz;

    if (posArr[i * 3 + 1] < -1.9) {
      posArr[i * 3 + 1] = 1.9;
      posArr[i * 3] = (Math.random() - 0.5) * 2.8;
    }
  }
  petalGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate();
</script>
</body>
</html>
